<!DOCTYPE html>
<html>
<head>
  <title>Spider-Man World</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(black, #111);
    }

    h1 {
      font-size: 40px;
      text-shadow: 0 0 20px red;
      animation: fadeUp 2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      background: red;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      box-shadow: 0 0 20px red;
    }

    /* Web drop */
    .web {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 150px;
      background: white;
      animation: drop 1s ease;
    }

    @keyframes drop {
      from { top: -150px; }
      to { top: 0; }
    }
  </style>
</head>

<body>

<div class="web"></div>

<div class="hero">
  <h1>🕷️ Enter the Spider-Verse</h1>
  <button onclick="alert('Welcome Hero 🕸️')">Explore Now</button>
</div>

</body>
</html>
